<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zeya 💙</title>

    <style>

        /* =========================================
           BASIC
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #4da6ff;
            --blue-dark: #116dcc;
            --light-blue: #b9e3ff;
            --bg: #020914;
            --text-soft: #91abc0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(77,166,255,.18),
                    transparent 31%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(20,109,204,.13),
                    transparent 30%
                ),
                #020914;
        }

        button {
            font-family: inherit;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .orb {
            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                rgba(77,166,255,.07);

            filter: blur(70px);

            animation: orbMove 7s ease-in-out infinite;
        }

        .orb.one {
            left: -100px;
            top: 10%;
        }

        .orb.two {
            right: -120px;
            bottom: 5%;

            animation-delay: 2s;
        }

        @keyframes orbMove {

            0%,100% {
                transform: scale(.85);
                opacity: .45;
            }

            50% {
                transform: scale(1.2);
                opacity: .9;
            }
        }


        /* Stars */

        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #bce5ff;

            box-shadow:
                0 0 10px #4da6ff;

            animation:
                twinkle 3s ease-in-out infinite;
        }

        .s1 { left: 10%; top: 18%; }
        .s2 { left: 23%; top: 71%; animation-delay: .8s; }
        .s3 { left: 51%; top: 12%; animation-delay: 1.4s; }
        .s4 { left: 78%; top: 24%; animation-delay: .4s; }
        .s5 { left: 91%; top: 57%; animation-delay: 1.8s; }
        .s6 { left: 68%; top: 82%; animation-delay: 2.2s; }
        .s7 { left: 6%; top: 48%; animation-delay: 1.1s; }

        @keyframes twinkle {

            0%,100% {
                opacity: .2;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }


        /* =========================================
           MAIN SCREEN
        ========================================= */

        .screen {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            position: relative;
        }


        /* =========================================
           CARD
        ========================================= */

        .card {
            width: 100%;
            max-width: 410px;

            padding: 34px 23px 25px;

            position: relative;
            z-index: 5;

            text-align: center;

            border-radius: 28px;

            border:
                1px solid
                rgba(151,210,255,.18);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 90px rgba(0,0,0,.58),
                inset 0 1px 0
                rgba(255,255,255,.08);

            animation:
                cardIn .65s ease;
        }

        @keyframes cardIn {

            from {
                opacity: 0;
                transform:
                    translateY(20px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           HEART
        ========================================= */

        .heart {
            width: 78px;
            height: 78px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 39px;

            background:
                radial-gradient(
                    circle,
                    rgba(77,166,255,.27),
                    rgba(77,166,255,.035)
                );

            border:
                1px solid
                rgba(141,204,255,.22);

            box-shadow:
                0 0 30px
                rgba(77,166,255,.14);

            animation:
                heartbeat 1.7s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }


        /* =========================================
           TITLES
        ========================================= */

        h1 {
            font-size: 52px;

            line-height: 1;

            font-weight: 900;

            letter-spacing: 2px;

            margin-bottom: 13px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #b9e3ff,
                    #4da6ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .question-title {
            font-size: 26px;

            line-height: 1.25;

            letter-spacing: .5px;
        }

        .subtitle {
            color: var(--text-soft);

            font-size: 11px;

            line-height: 1.8;

            letter-spacing: 1.3px;

            margin-bottom: 27px;
        }


        /* =========================================
           START / NEXT BUTTON
        ========================================= */

        .main-button {
            width: 100%;
            max-width: 235px;

            min-height: 58px;

            padding: 0 18px;

            border-radius: 17px;

            border:
                1px solid
                rgba(170,221,255,.42);

            background:
                linear-gradient(
                    135deg,
                    #126fc8,
                    #4da6ff
                );

            color: white;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 3px;

            cursor: pointer;

            box-shadow:
                0 10px 32px
                rgba(77,166,255,.25),

                inset 0 1px 0
                rgba(255,255,255,.3);

            transition: .25s ease;
        }

        .main-button:hover {
            transform:
                translateY(-4px)
                scale(1.02);

            box-shadow:
                0 15px 42px
                rgba(77,166,255,.42);
        }

        .main-button:active {
            transform: scale(.95);
        }


        /* =========================================
           CREATOR
        ========================================= */

        .creator {
            margin-top: 25px;

            color: #526c82;

            font-size: 7px;

            font-weight: 800;

            letter-spacing: 1.4px;
        }

        .creator a {
            color: #7faed4;

            text-decoration: none;
        }

        .creator a:hover {
            color: #b9e3ff;

            text-shadow:
                0 0 12px
                rgba(77,166,255,.7);
        }


        /* =========================================
           PROGRESS
        ========================================= */

        .progress {
            color: #6398c2;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: 2px;

            margin-bottom: 16px;
        }

        .progress-line {
            width: 100%;
            height: 4px;

            margin-bottom: 22px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.07);

            overflow: hidden;
        }

        .progress-fill {
            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #126fc8,
                    #4da6ff
                );

            box-shadow:
                0 0 12px
                rgba(77,166,255,.7);

            transition: .4s ease;
        }


        /* =========================================
           ANSWERS
        ========================================= */

        .answers {
            width: 100%;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 8px;
        }

        .answer {
            min-height: 70px;

            padding: 9px;

            border-radius: 17px;

            border:
                1px solid
                rgba(141,204,255,.15);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.065),
                    rgba(255,255,255,.018)
                );

            color: #e9f6ff;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 5px;

            transition: .22s ease;
        }

        .answer:hover {
            transform: translateY(-3px);

            border-color:
                rgba(77,166,255,.55);

            background:
                rgba(77,166,255,.12);

            box-shadow:
                0 0 22px
                rgba(77,166,255,.13);
        }

        .answer:active {
            transform: scale(.94);
        }

        .answer.correct {
            border-color: #4da6ff;

            background:
                rgba(77,166,255,.22);

            box-shadow:
                0 0 30px
                rgba(77,166,255,.35);

            transform: scale(1.03);
        }

        .answer.wrong {
            border-color: #628099;

            animation: shake .35s ease;
        }

        .answer-emoji {
            font-size: 22px;
        }

        .answer-text {
            font-size: 9px;

            font-weight: 800;

            letter-spacing: .4px;
        }

        @keyframes shake {

            0%,100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }


        /* =========================================
           FLOATING HEARTS
        ========================================= */

        .floating-heart {
            position: fixed;

            bottom: -30px;

            font-size: 20px;

            pointer-events: none;

            z-index: 20;

            animation:
                floatUp 4s linear forwards;
        }

        @keyframes floatUp {

            0% {
                opacity: 0;
                transform:
                    translateY(0)
                    scale(.7);
            }

            15% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    translateY(-105vh)
                    rotate(25deg)
                    scale(1.3);
            }
        }


        /* =========================================
           FINAL MESSAGE
        ========================================= */

        .love-text {
            color: #c1dff3;

            font-size: 12px;

            line-height: 2;

            letter-spacing: .5px;

            margin-bottom: 25px;
        }

        .love-highlight {
            color: #8dccff;

            font-weight: 900;

            font-size: 15px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .screen {
                padding: 15px;
            }

            .card {
                max-width: 390px;

                padding:
                    30px 18px 23px;

                border-radius: 25px;
            }

            .heart {
                width: 70px;
                height: 70px;

                font-size: 35px;
            }

            h1 {
                font-size: 47px;
            }

            .question-title {
                font-size: 23px;
            }

            .subtitle {
                font-size: 10px;
            }

            .answer {
                min-height: 66px;
            }

            .answer-emoji {
                font-size: 20px;
            }

            .answer-text {
                font-size: 8px;
            }

            .main-button {
                max-width: 215px;
            }
        }

    </style>

</head>


<body>

         BACKGROUND
    ========================================== -->

        <span class="star s5"></span>

    </div>

    <script>

                <div class="creator">

                        target="_blank"

                    >

        }


        /* =========================================
           FLOATING HEARTS
        ========================================= */

        function hearts() {

            const emojis = [
                "💙",
                "💙",
                "✨",
                "💫",
                "🩵"
            ];

            for (let i = 0; i < 16; i++) {

                setTimeout(() => {

                    const heart =
                        document.createElement("div");

                    heart.className =
                        "floating-heart";

                    heart.innerHTML =
                        emojis[
                            Math.floor(
                                Math.random() *
                                emojis.length
                            )
                        ];

                    heart.style.left =
                        Math.random() * 100 + "%";

                    heart.style.animationDuration =
                        (3 + Math.random() * 2) + "s";

                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 5000);

                }, i * 130);
            }
        }


        /* =========================================
           OPENING SCREEN
        ========================================== */

            app.innerHTML = `

                    <section class="card">

                        <div class="heart">
                            💙
                        </div>

                        <h1>
                            Zeya
                        </h1>

                        <p class="subtitle">
                            A Little Surprise<br>
                            Made Just For You ✨
                        </p>

                        <button
                            class="main-button"
                            id="startBtn"
                        >
                            START
                            ❤️
                        </button>

                        ${creatorHTML()}

                    </section>

                </main>
            `;

            document
                .getElementById("startBtn")
                .addEventListener(
                    "click",
                    welcomeScreen
                );
        }

           WELCOME
        ========================================== */

        function welcomeScreen() {

                        <div class="heart">

                        </div>

                        <h1>

                        </h1>

                        <p class="subtitle">

                        </p>

                            id="playBtn"
                        >
                            LET'S PLAY
                            💙
                        </button>

                );
