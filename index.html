<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zeya 💙</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 20%, #12345a 0%, #071525 35%, #020914 75%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}


/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#126fc8;
    opacity:.10;
    filter:blur(90px);
}

.glow1{
    left:-150px;
    top:10%;
}

.glow2{
    right:-150px;
    bottom:5%;
}


/* BLINKING DOTS */

.dot{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#d8efff;
    box-shadow:0 0 12px #5db5ff;
    animation:blink 2s infinite;
}

.d1{left:12%;top:18%;}
.d2{left:27%;top:70%;animation-delay:.4s;}
.d3{left:51%;top:14%;animation-delay:.8s;}
.d4{left:77%;top:25%;animation-delay:1.2s;}
.d5{left:90%;top:58%;animation-delay:1.6s;}
.d6{left:68%;top:82%;animation-delay:.5s;}

@keyframes blink{

    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

}


/* MAIN */

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    position:relative;
    z-index:2;
}


/* CARD */

.card{
    width:100%;
    max-width:410px;
    padding:38px 22px 25px;
    text-align:center;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(150,210,255,.20);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    animation:appear .7s ease;
}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(20px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* HEART */

.big-heart{
    width:105px;
    height:105px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(45,145,255,.35),
            rgba(45,145,255,.04)
        );

    border:1px solid rgba(140,210,255,.25);

    box-shadow:
        0 0 35px rgba(45,145,255,.25);

    font-size:55px;

    animation:heartBeat 1.8s infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}


/* NAME */

.name{
    font-size:58px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:15px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #bce5ff,
            #4da6ff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}


/* TEXT */

.subtitle{
    color:#91abc0;
    font-size:12px;
    line-height:1.8;
    letter-spacing:1px;
    margin-bottom:30px;
}


/* START */

.start-button{

    width:100%;
    max-width:270px;

    height:65px;

    border:none;
    border-radius:18px;

    color:white;

    font-size:13px;
    font-weight:900;
    letter-spacing:4px;

    background:
        linear-gradient(
            135deg,
            #1373d0,
            #49a5ff
        );

    box-shadow:
        0 12px 35px rgba(45,145,255,.35),
        inset 0 1px 0 rgba(255,255,255,.35);

    cursor:pointer;

    transition:.25s;
}

.start-button:hover{

    transform:translateY(-4px);

    box-shadow:
        0 18px 45px rgba(45,145,255,.5);

}

.start-button:active{

    transform:scale(.95);

}


/* CREATOR */

.creator{

    margin-top:28px;

    color:#526c82;

    font-size:7px;

    font-weight:800;

    letter-spacing:1.5px;
}

.creator a{

    color:#83b8df;

    text-decoration:none;

}

.creator a:hover{

    color:#bce5ff;

}


/* SMALL BLUE LINE */

.line{

    width:78px;
    height:4px;

    margin:25px auto 0;

    border-radius:20px;

    background:#4da6ff;

    box-shadow:
        0 0 15px rgba(77,166,255,.7);

}


/* NEXT SCREEN */

#surprise{
    display:none;
}

.surprise-title{

    font-size:42px;
    font-weight:900;

    margin-bottom:15px;

    background:
        linear-gradient(
            135deg,
            white,
            #4da6ff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.surprise-text{

    color:#a9c4d8;

    font-size:11px;

    line-height:2;

    margin-bottom:25px;

}


/* PHOTO */

.photo{

    width:100%;
    height:230px;

    object-fit:cover;

    border-radius:20px;

    border:1px solid rgba(140,210,255,.2);

    box-shadow:
        0 15px 35px rgba(0,0,0,.4);

    margin-bottom:20px;

}


/* MOBILE */

@media(max-width:450px){

    .card{
        padding:32px 17px 23px;
    }

    .name{
        font-size:52px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="bg">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
    <div class="dot d5"></div>
    <div class="dot d6"></div>

</div>


<!-- MUSIC -->

<audio id="loveSong" loop>

    <source
        src="sahil%20love.mp3"
        type="audio/mpeg">

</audio>


<!-- START SCREEN -->

<div class="page" id="startScreen">

    <div class="card">

        <div class="big-heart">
            💙
        </div>


        <div class="name">
            Zeya
        </div>


        <div class="subtitle">

            A Little Surprise<br>
            Made Just For You ✨

        </div>


        <button
            class="start-button"
            onclick="startGame()">

            START ❤️

        </button>


        <div class="creator">

            Created by

            <a
                href="https://www.instagram.com/be.like_sahil/"
                target="_blank"
                rel="noopener noreferrer">

                @be.like_sahil

            </a>

        </div>


        <div class="line"></div>

    </div>

</div>



<!-- SURPRISE SCREEN -->

<div
    class="page"
    id="surprise">

    <div class="card">

        <div class="big-heart">
            💙
        </div>


        <div class="surprise-title">
            Hey Zeya
        </div>


        <div class="surprise-text">

            Your little surprise has started. 🥹💙

            <br><br>

            Favourite Food 🍫 Chocolate<br>
            Favourite Food 🍜 Maggie<br>
            Favourite Colour 💙 Blue<br>
            Birthday 🌸 March<br>
            Favourite Song 🎵 Ishq Ke Jaan

        </div>


        <button
            class="start-button"
            onclick="showPhoto()">

            NEXT ✨

        </button>


        <div class="creator">

            Created by

            <a
                href="https://www.instagram.com/be.like_sahil/"
                target="_blank"
                rel="noopener noreferrer">

                @be.like_sahil

            </a>

        </div>

    </div>

</div>



<script>

function startGame(){

    /* START BUTTON CLICK = MUSIC */

    const song =
        document.getElementById("loveSong");

    song.volume = 0.75;

    song.play().catch(function(){

        console.log(
            "Music could not start."
        );

    });


    /* CHANGE SCREEN */

    document.getElementById(
        "startScreen"
    ).style.display = "none";


    document.getElementById(
        "surprise"
    ).style.display = "flex";

}


/* PHOTO SCREEN */

function showPhoto(){

    document.getElementById(
        "surprise"
    ).innerHTML = `

        <div class="card">

            <div class="surprise-title">
                Zeya 💙
            </div>

            <div class="surprise-text">
                A few beautiful memories... ✨
            </div>

            <img
                class="photo"
                src="zeya1.jpg"
                alt="Zeya">

            <button
                class="start-button"
                onclick="location.reload()">

                START AGAIN ↻

            </button>

            <div class="creator">

                Created by

                <a
                    href="https://www.instagram.com/be.like_sahil/"
                    target="_blank"
                    rel="noopener noreferrer">

                    @be.like_sahil

                </a>

            </div>

        </div>

    `;

}

</script>


</body>
</html>
